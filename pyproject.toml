[project]
name = "memory-framework"
version = "0.1.0"
description = "AI agent memory framework: 跨 session 经验积累，SQLite+FTS+vec 单文件存储"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlite-vec>=0.1.6",
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "langchain-core>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "markitdown[all]>=0.1.5",
    "pyarrow>=25.0.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# rag-clean 移植件：保持原样少 diff，不追新式类型标注
"src/memory/evolution/doc/chunker.py" = ["UP006", "UP035", "UP045", "RUF012", "BLE001", "I001", "F401"]
"src/memory/evolution/doc/models.py" = ["UP006", "UP035", "UP045", "RUF012", "I001"]
"src/memory/evolution/doc/clean.py" = ["UP006", "UP035", "UP045", "RUF012", "BLE001", "SIM103"]
"src/memory/evolution/doc/extract.py" = ["BLE001", "UP045", "PLW1510"]
