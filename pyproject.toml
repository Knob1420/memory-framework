[project]
name = "memory-framework"
version = "0.1.0"
description = "AI agent memory framework: 跨 session 经验积累，SQLite+FTS+vec 单文件存储"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlite-vec>=0.1.6",
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
